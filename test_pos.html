<!DOCTYPE html><html><head><style>
@page {
  size: A4;
  margin-top: 1cm;
  margin-bottom: 1.6cm;
  margin-left: 0.5cm;
  margin-right: 0.5cm;
  @bottom-left {
    content: "Page " counter(page) " of 2";
    font-family: Cambria, serif;
    font-size: 8.5px;
    font-weight: 700;
    color: #333;
    vertical-align: top;
    padding-top: 0;
  }
}
.page { height: 200mm; page-break-after: always; }
.footer {
  position: fixed;
  bottom: 0;
  left: 0.5cm;
  right: 0.5cm;
  height: 50px;
  border-top: 1px solid blue;
}
</style></head><body>
<div class="footer">Footer content under blue line</div>
<div class="page">Page 1 content</div>
<div class="page">Page 2 content</div>
</body></html>
